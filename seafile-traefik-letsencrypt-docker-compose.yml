# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  mariadb: &mariadb-image ${SEAFILE_MARIADB_IMAGE_TAG:-mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430}
  redis: &redis-image ${SEAFILE_REDIS_IMAGE_TAG:-redis:7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}
  seafile: &seafile-image ${SEAFILE_IMAGE_TAG:-seafileltd/seafile-mc:13.0.25@sha256:90c1aaa08731116750cd7ce16cbc6afe0c26006433002d3c7215a5f4254ec244}

networks:
  seafile-network:
    external: true
  traefik-network:
    external: true

volumes:
  mariadb-data:
  redis-data:
  seafile-data:
  seafile-mariadb-backup:
  seafile-data-backups:
  seafile-database-backups:
  traefik-certificates:

services:
  mariadb:
    image: *mariadb-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. SEAFILE_MARIADB_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SEAFILE_MARIADB_MEMORY_LIMIT:-1g}
          cpus: "${SEAFILE_MARIADB_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${SEAFILE_MARIADB_MEMORY_RESERVATION:-128m}
          cpus: "${SEAFILE_MARIADB_CPU_RESERVATION:-0.25}"
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_USER: ${SEAFILE_DB_USER:-seafiledbuser}
      MARIADB_PASSWORD: ${SEAFILE_DB_PASSWORD:?set in .env - see .env.example for generation command}
      MARIADB_ROOT_PASSWORD: ${SEAFILE_DB_ADMIN_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - seafile-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    # Seafile 13 moved its cache from memcached to Redis.
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. SEAFILE_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SEAFILE_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${SEAFILE_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${SEAFILE_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${SEAFILE_REDIS_CPU_RESERVATION:-0.1}"
    volumes:
      - redis-data:/data
    networks:
      - seafile-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  seafile:
    image: *seafile-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. SEAFILE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SEAFILE_MEMORY_LIMIT:-1g}
          cpus: "${SEAFILE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${SEAFILE_MEMORY_RESERVATION:-128m}
          cpus: "${SEAFILE_CPU_RESERVATION:-0.25}"
    volumes:
      - seafile-data:${DATA_PATH:-/shared}
    # Seafile 12+ changed the container's environment contract: the
    # MYSQL_*/SEAFILE_ADMIN-style variables from Seafile 11 are dead, the
    # cache moved to Redis, and JWT_PRIVATE_KEY is required.
    environment:
      SEAFILE_MYSQL_DB_HOST: mariadb
      SEAFILE_MYSQL_DB_PORT: 3306
      SEAFILE_MYSQL_DB_USER: ${SEAFILE_DB_USER:-seafiledbuser}
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_DB_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_HOSTNAME:?set in .env - see .env.example}
      SEAFILE_SERVER_PROTOCOL: https
      INIT_SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_USERNAME:?set in .env - see .env.example}
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD:?set in .env - see .env.example for generation command}
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY:?set in .env - see .env.example for generation command}
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TIME_ZONE: ${SEAFILE_TIMEZONE:-America/New_York}
    networks:
      - seafile-network
      - traefik-network
    # Port 80 is the container's bundled nginx: Seafile 13 binds seahub to
    # localhost only, so Traefik must target nginx, which also serves the
    # /seafhttp and /seafdav paths.
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Global settings for compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Match incoming requests on the specific hostname for Seafile/Seahub
      - "traefik.http.routers.seafile.rule=Host(`${SEAFILE_HOSTNAME}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.seafile.service=seafile"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.seafile.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.seafile.loadbalancer.server.port=80"
      # Enable TLS on this router
      - "traefik.http.routers.seafile.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.seafile.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.seafile.loadbalancer.passhostheader=true"
      # Apply middlewares for security headers and compression
      - "traefik.http.routers.seafile.middlewares=sec-headers,compresstraefik"
      # Match incoming requests on the specific hostname for Seafdav
      - "traefik.http.routers.seafile-dav.rule=Host(`${SEAFILE_HOSTNAME}`) && PathPrefix(`/seafdav`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.seafile-dav.service=seafile-dav"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.seafile-dav.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.seafile-dav.loadbalancer.server.port=80"
      # Enable TLS on this router
      - "traefik.http.routers.seafile-dav.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.seafile-dav.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.seafile-dav.loadbalancer.passhostheader=true"
      # Apply compression middleware
      - "traefik.http.routers.seafile-dav.middlewares=compresstraefik"
      # Match incoming requests on the specific hostname for Seafhttp
      - "traefik.http.routers.seafile-http.rule=Host(`${SEAFILE_HOSTNAME}`) && PathPrefix(`/seafhttp`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.seafile-http.service=seafile-http"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.seafile-http.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.seafile-http.loadbalancer.server.port=80"
      # Enable TLS on this router
      - "traefik.http.routers.seafile-http.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.seafile-http.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.seafile-http.loadbalancer.passhostheader=true"
      # No prefix stripping: the container's bundled nginx expects the
      # /seafhttp path and proxies it to the file server itself.
      - "traefik.http.routers.seafile-http.middlewares=compresstraefik"
      # Security headers settings
      - "traefik.http.middlewares.sec-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=same-origin"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"

    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *mariadb-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. SEAFILE_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SEAFILE_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${SEAFILE_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${SEAFILE_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${SEAFILE_BACKUPS_CPU_RESERVATION:-0.1}"
    # `$$VAR` / `$$(...)` escapes are required so docker compose does NOT
    # interpolate these at config time — they are resolved by the container
    # shell at runtime from the `environment:` block below. The dump names
    # Seafile's three databases explicitly: `--all-databases` as the
    # non-root seafile user fails on the mysql system schema.
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$MARIADB_BACKUPS_PATH/$$MARIADB_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if mariadb-dump -h mariadb -u "$$SEAFILE_DB_USER" -p"$$SEAFILE_DB_PASSWORD" --databases ccnet_db seafile_db seahub_db | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" "$$DATA_PATH"; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${MARIADB_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$MARIADB_BACKUPS_PATH" -type f -name "$$MARIADB_BACKUP_NAME-*" -mtime "+$$MARIADB_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - seafile-mariadb-backup:/var/lib/mysql
      - seafile-data:${DATA_PATH:-/shared}
      - seafile-data-backups:${DATA_BACKUPS_PATH:-/srv/seafile-application-data/backups}
      - seafile-database-backups:${MARIADB_BACKUPS_PATH:-/srv/seafile-mariadb/backups}
    environment:
      SEAFILE_DB_USER: ${SEAFILE_DB_USER:-seafiledbuser}
      SEAFILE_DB_PASSWORD: ${SEAFILE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SEAFILE_DB_ADMIN_PASSWORD:?set in .env - see .env.example for generation command}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      MARIADB_BACKUP_PRUNE_DAYS: ${MARIADB_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      MARIADB_BACKUPS_PATH: ${MARIADB_BACKUPS_PATH:-/srv/seafile-mariadb/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/seafile-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/shared}
      MARIADB_BACKUP_NAME: ${MARIADB_BACKUP_NAME:-seafile-mariadb-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-seafile-application-data-backup}
    networks:
      - seafile-network
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
